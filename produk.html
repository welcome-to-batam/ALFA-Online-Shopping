// ==========================================
// 3. FITUR ZOOM GALERI
// ==========================================
let zoomIndex = 0; 

function bukaZoom(idx) {
  zoomIndex = idx;
  tampilkanGambarZoom();
  document.getElementById('overlayZoom').style.display = 'flex';
  
  const overlayEl = document.getElementById('overlayZoom');
  overlayEl.ontouchstart = (e) => {
    if (e.touches.length === 1) {
      overlayEl.dataset.startX = e.touches[0].clientX;
      overlayEl.dataset.isSwiping = "true";
    } else {
      overlayEl.dataset.isSwiping = "false";
    }
  };
  overlayEl.ontouchmove = (e) => {
    if (e.touches.length > 1) overlayEl.dataset.isSwiping = "false";
  };
  overlayEl.ontouchend = (e) => {
    if (overlayEl.dataset.isSwiping === "true" && e.changedTouches.length === 1) {
      let diff = e.changedTouches[0].clientX - parseFloat(overlayEl.dataset.startX);
      if(diff < -50) nextZoom();
      if(diff > 50) prevZoom();
    }
    overlayEl.dataset.isSwiping = "false";
  };
}

function tampilkanGambarZoom() {
  const imgZoom = document.getElementById('gambarZoom');
  imgZoom.src = arrGambar[zoomIndex]; 
  document.getElementById('prevZoom').style.display = zoomIndex === 0 ? 'none' : 'block';
  document.getElementById('nextZoom').style.display = zoomIndex === arrGambar.length - 1 ? 'none' : 'block';
  document.getElementById('zoomIndicator').textContent = `${zoomIndex + 1} / ${arrGambar.length}`;
}

function nextZoom() {
  if (zoomIndex < arrGambar.length - 1) { zoomIndex++; tampilkanGambarZoom(); }
}

function prevZoom() {
  if (zoomIndex > 0) { zoomIndex--; tampilkanGambarZoom(); }
}

function tutupZoom() {
  document.getElementById('overlayZoom').style.display = 'none';
  const overlayEl = document.getElementById('overlayZoom');
  overlayEl.ontouchstart = null;
  overlayEl.ontouchmove = null;
  overlayEl.ontouchend = null;
}

  // --- Logo Mas Gondrong---
  const canvas = document.getElementById('fireCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const centerX = width / 2;
  const centerY = height / 2;
  const radius = 40;

  class FlameParticle {
    constructor(angle) {
      this.angle = angle;
      this.radius = radius + (Math.random() * 7 - 3);
      this.size = Math.random() * 4 + 3;
      this.speedAngle = 0.004 + Math.random() * 0.004;
      this.flameLength = 10 + Math.random() * 10;
      this.offset = Math.random() * 1000;
    }

    update(time) {
      this.angle += this.speedAngle;
      this.x = centerX + this.radius * Math.cos(this.angle);
      this.y = centerY + this.radius * Math.sin(this.angle);
      this.flameProgress = (Math.sin(time / 300 + this.offset) + 1) / 2;
    }

    draw(ctx) {
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
      grad.addColorStop(0, `rgba(255, 200, 0, ${0.8 * this.flameProgress})`);
      grad.addColorStop(0.5, `rgba(255, 100, 0, ${0.6 * this.flameProgress})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      const tipX = centerX + (this.radius - this.flameLength * this.flameProgress) * Math.cos(this.angle);
      const tipY = centerY + (this.radius - this.flameLength * this.flameProgress) * Math.sin(this.angle);
      ctx.lineTo(tipX, tipY);
      ctx.lineWidth = this.size / 3;
      ctx.strokeStyle = `rgba(255, 140, 0, ${0.7 * this.flameProgress})`;
      ctx.shadowColor = `rgba(255, 140, 0, ${0.9 * this.flameProgress})`;
      ctx.shadowBlur = 5;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  const particles = [];
  const particleCount = 20;
  for (let i = 0; i < particleCount; i++) {
    particles.push(new FlameParticle((i / particleCount) * Math.PI * 2));
  }

  function animate(time = 0) {
    ctx.clearRect(0, 0, width, height);
    particles.forEach(p => {
      p.update(time);
      p.draw(ctx);
    });
    requestAnimationFrame(animate);
  }
  animate();

  // Kontrol muncul/hilang animasi saat scroll
  const anim = document.getElementById('masGondrongAnimation');
  let scrollTimeout;

  window.addEventListener('scroll', () => {
    anim.style.opacity = '0';
    if (scrollTimeout) clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      anim.style.opacity = '1';
    }, 2000);
  });
</script>

</body>
</html>
